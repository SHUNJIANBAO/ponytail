# dsh-ponytail bundle patch：在 dsh-base 层之上插入一行。
#
# 同一行同时挂载两半：
#   - 宿主半 lib/index.js —— 把包内 skills/ 下的三个技能注册进 ctx.skills
#   - 浏览器半 lib/client.js —— 输入栏「懒散等级」下拉（dsh-client-modules 按包名挂载）
#
# 本文件由 dsh.bundle.patch 机制自动注入，profile 的 cordis.patch.yml 不要再手写
# 同一行，否则会重复挂载。
- insert:
    - id: dsh-ponytail
      name: 'dsh-ponytail'
